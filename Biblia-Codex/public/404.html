<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bíblia Codex</title>
  <script>
    sessionStorage.redirect = location.href;
  </script>
  <meta http-equiv="refresh" content="0;URL='/Biblia-Codex/'">
</head>
<body>
  <script>
    var path = sessionStorage.redirect;
    if (path) {
      sessionStorage.removeItem('redirect');
      var base = '/Biblia-Codex/';
      var target = path.startsWith(base) ? path : base + path.replace(/^\/+/, '');
      location.href = target;
    }
  </script>
</body>
</html>
