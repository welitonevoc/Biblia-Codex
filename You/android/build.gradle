buildscript {
  // Simple helper that allows the root project to override versions declared by this library.
  ext.safeExtGet = { prop, fallback ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
  }

  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    def agpVersion = safeExtGet("agpVersion", "8.13.2")
    classpath("com.android.tools.build:gradle:$agpVersion")
    def kotlinVersion = safeExtGet("kotlinVersion", "2.0.21")
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

apply plugin: 'com.android.library'

group = 'com.youversion.reactnativesdk'
version = '0.11.1'

def expoModulesCorePlugin = new File(
  project.provider {
    try {
      return project(":expo-modules-core").projectDir.absolutePath
    } catch (Exception e) {
      return "${project.rootDir}/../node_modules/expo-modules-core/android"
    }
  }.get(),
  "ExpoModulesCorePlugin.gradle"
)

if (expoModulesCorePlugin.exists()) {
  apply from: expoModulesCorePlugin
  apply plugin: 'org.jetbrains.kotlin.plugin.compose'
  applyKotlinExpoModulesCorePlugin()
  useCoreDependencies()
  useExpoPublishing()
} else {
  // Fallback case if expo-modules-core is not found
  apply plugin: 'org.jetbrains.kotlin.android'
  apply plugin: 'org.jetbrains.kotlin.plugin.compose'
}

// If you want to use the managed Android SDK versions from expo-modules-core, set this to true.
// The Android SDK versions will be bumped from time to time in SDK releases and may introduce breaking changes in your module code.
// Most of the time, you may like to manage the Android SDK versions yourself.
def useManagedAndroidSdkVersions = false
if (useManagedAndroidSdkVersions) {
  useDefaultAndroidSdkVersions()
} else {
  project.android {
    compileSdkVersion safeExtGet("compileSdkVersion", 36)
    defaultConfig {
      minSdkVersion safeExtGet("minSdkVersion", 24)
      targetSdkVersion safeExtGet("targetSdkVersion", 36)
    }
  }
}

android {
  namespace "com.youversion.reactnativesdk"
  defaultConfig {
    versionCode 1
    versionName "0.11.1"
  }
  buildFeatures {
    compose true
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'androidx.compose.ui:ui-android:1.9.1'
  implementation 'androidx.compose.foundation:foundation-android:1.9.1'
  implementation 'androidx.compose.material3:material3-android:1.3.2'

  implementation 'com.youversion.platform:platform-core:1.1.1'
  implementation 'com.youversion.platform:platform-ui:1.1.1'
  implementation 'com.youversion.platform:platform-reader:1.1.1'
}
